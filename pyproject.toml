[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migrate-guard"
version = "0.1.0"
description = "CI linter that catches dangerous database migrations before they reach production"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ali Raza", email = "thealirazadev@gmail.com" }]
keywords = ["migrations", "postgres", "mysql", "linter", "ci", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "sqlglot==30.14.0",
    "click==8.4.2",
]

[project.urls]
Homepage = "https://github.com/thealirazadev/migrate-guard"
Issues = "https://github.com/thealirazadev/migrate-guard/issues"

[project.scripts]
migrate-guard = "migrate_guard.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.15.4",
    "black==26.5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/migrate_guard"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
